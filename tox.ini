[tox]
# Build the sdist/wheel through PEP 517 (setuptools) for every env.
isolated_build = True
envlist = py310

[testenv]
description = Run the test suite
deps =
    pytest>=7
commands =
    pytest {posargs}

[testenv:build]
description = Build the sdist and wheel into dist/
skip_install = True
deps =
    build>=1.0
commands =
    python -m build {posargs}

[testenv:lint]
description = Byte-compile check (no third-party linter dependency)
skip_install = True
commands =
    python -m compileall -q fi50x
