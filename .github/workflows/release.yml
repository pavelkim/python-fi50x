name: Release

# Publishes to PyPI when a GitHub Release is published. Uses PyPI Trusted
# Publishing (OIDC) — no API token/secret. PyPI validates this workflow by its
# path (.github/workflows/release.yml), so do not rename the file without also
# updating the trusted publisher on PyPI.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c "import re, pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('fi50x/version.py').read_text()).group(1))")"
          echo "release tag: $TAG / package version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match fi50x.version.__version__ ($VERSION). Bump fi50x/version.py or fix the tag."
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Best-practice deployment environment; enables adding release protection
    # rules later. Remove or rename if your PyPI trusted publisher pins a
    # different environment (you specified only the workflow name, so this
    # assumes the publisher was registered without an environment).
    environment:
      name: pypi
      url: https://pypi.org/p/python-fi50x
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
